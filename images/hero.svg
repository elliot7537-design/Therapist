<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sunrise over mountains with a figure looking up">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4ecef"/>
      <stop offset="0.35" stop-color="#b4cdd3"/>
      <stop offset="0.7" stop-color="#7a9fa7"/>
      <stop offset="1" stop-color="#45757d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.72" cy="0.48" r="0.35">
      <stop offset="0" stop-color="#fbe9c6" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#f2d19b" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#c9b07c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7a9fa7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fdf3da"/>
      <stop offset="0.6" stop-color="#f3d59d"/>
      <stop offset="1" stop-color="#d9aa6a" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="mistA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c7277"/>
      <stop offset="1" stop-color="#2e525a"/>
    </linearGradient>
    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4c51"/>
      <stop offset="1" stop-color="#173338"/>
    </linearGradient>
    <linearGradient id="ridge3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16303a"/>
      <stop offset="1" stop-color="#0a1f27"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Warm sun glow -->
  <rect width="1600" height="900" fill="url(#sunGlow)"/>

  <!-- Sun disc -->
  <circle cx="1152" cy="432" r="120" fill="url(#sunCore)"/>
  <circle cx="1152" cy="432" r="200" fill="#fdf3da" opacity="0.12"/>

  <!-- Drifting clouds / mist -->
  <ellipse cx="300" cy="280" rx="260" ry="22" fill="url(#mistA)"/>
  <ellipse cx="900" cy="220" rx="300" ry="18" fill="url(#mistA)"/>
  <ellipse cx="1350" cy="320" rx="220" ry="16" fill="url(#mistA)"/>

  <!-- Far ridge -->
  <path fill="url(#ridge1)" opacity="0.85"
        d="M0,640 L140,600 L260,620 L420,560 L580,600 L740,560 L900,600 L1080,560 L1260,600 L1420,580 L1600,610 L1600,900 L0,900 Z"/>

  <!-- Mid ridge -->
  <path fill="url(#ridge2)"
        d="M0,730 L180,690 L340,720 L500,680 L660,720 L820,690 L1000,720 L1180,690 L1360,720 L1520,700 L1600,710 L1600,900 L0,900 Z"/>

  <!-- Near ridge with path -->
  <path fill="url(#ridge3)"
        d="M0,810 L160,790 L320,800 L500,780 L680,795 L860,780 L1040,795 L1220,780 L1400,790 L1600,780 L1600,900 L0,900 Z"/>

  <!-- Rising light mist over water/valley -->
  <rect x="0" y="780" width="1600" height="40" fill="#fdf3da" opacity="0.1"/>
  <rect x="0" y="760" width="1600" height="14" fill="#fdf3da" opacity="0.06"/>

  <!-- Figure silhouette standing on near ridge -->
  <g transform="translate(740, 660)" fill="#0a1b22">
    <!-- head -->
    <circle cx="0" cy="-108" r="22"/>
    <!-- body -->
    <path d="M-26,-86 C-34,-60 -36,-30 -32,10 L-22,120 L22,120 L32,10 C36,-30 34,-60 26,-86 Z"/>
    <!-- raised arms (welcoming / looking up) -->
    <path d="M-24,-74 C-48,-88 -68,-72 -72,-42 C-74,-30 -66,-22 -60,-30 C-54,-42 -42,-56 -22,-62 Z"/>
    <path d="M24,-74 C48,-88 68,-72 72,-42 C74,-30 66,-22 60,-30 C54,-42 42,-56 22,-62 Z"/>
  </g>

  <!-- Small birds ascending -->
  <g fill="#0a1b22" opacity="0.85">
    <path d="M450,300 q10,-10 20,0 q10,-10 20,0" fill="none" stroke="#0a1b22" stroke-width="3" stroke-linecap="round"/>
    <path d="M520,260 q8,-8 16,0 q8,-8 16,0" fill="none" stroke="#0a1b22" stroke-width="3" stroke-linecap="round"/>
    <path d="M600,240 q7,-7 14,0 q7,-7 14,0" fill="none" stroke="#0a1b22" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M680,200 q6,-6 12,0 q6,-6 12,0" fill="none" stroke="#0a1b22" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M760,170 q5,-5 10,0 q5,-5 10,0" fill="none" stroke="#0a1b22" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Soft foreground grain / grass suggestion -->
  <g opacity="0.35" fill="#0a1b22">
    <rect x="0" y="870" width="1600" height="30"/>
  </g>
</svg>
