<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Open hands releasing a dove">
  <defs>
    <linearGradient id="dSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8efea"/>
      <stop offset="1" stop-color="#95b4aa"/>
    </linearGradient>
    <radialGradient id="dGlow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efcda0"/>
      <stop offset="1" stop-color="#a57849"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#dSky)"/>
  <rect width="800" height="600" fill="url(#dGlow)"/>

  <!-- Soft rays -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.35" fill="none">
    <line x1="400" y1="40" x2="280" y2="280"/>
    <line x1="400" y1="40" x2="360" y2="280"/>
    <line x1="400" y1="40" x2="440" y2="280"/>
    <line x1="400" y1="40" x2="520" y2="280"/>
  </g>

  <!-- Left hand -->
  <path fill="url(#hand)" d="M220,560
    C210,480 220,420 260,380
    C290,350 330,350 360,380
    C380,400 390,440 388,480
    L388,560 Z"/>
  <!-- Right hand -->
  <path fill="url(#hand)" d="M580,560
    C590,480 580,420 540,380
    C510,350 470,350 440,380
    C420,400 410,440 412,480
    L412,560 Z"/>

  <!-- Dove -->
  <g transform="translate(400 280)">
    <!-- body -->
    <path fill="#ffffff" d="M-50,20 C-40,-10 0,-30 40,-10 C60,0 70,16 58,30 C40,50 0,56 -40,46 C-58,42 -60,30 -50,20 Z"/>
    <!-- head -->
    <circle cx="50" cy="-4" r="12" fill="#ffffff"/>
    <!-- beak -->
    <path d="M60,-4 l12,-2 l-8,6 Z" fill="#e8b671"/>
    <!-- wing -->
    <path fill="#e6ece9" d="M-20,0 C-30,-30 -10,-50 20,-46 C34,-44 40,-30 30,-14 C14,-4 -6,6 -20,0 Z"/>
    <!-- tail -->
    <path fill="#ffffff" d="M-50,20 L-80,10 L-70,28 L-80,40 L-50,32 Z"/>
  </g>

  <!-- Olive branch in beak -->
  <g transform="translate(472 276)" fill="#4a6e3d">
    <path d="M0,0 q10,-6 18,-2" stroke="#3d5d31" stroke-width="2" fill="none"/>
    <ellipse cx="6" cy="-4" rx="4" ry="2" transform="rotate(20 6 -4)"/>
    <ellipse cx="14" cy="-6" rx="4" ry="2" transform="rotate(20 14 -6)"/>
  </g>
</svg>
