<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stone archway opening toward a sunlit mountain path">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dce7e9"/>
      <stop offset="1" stop-color="#8aa7ac"/>
    </linearGradient>
    <radialGradient id="gLight" cx="0.5" cy="0.55" r="0.4">
      <stop offset="0" stop-color="#fef0d4" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#fef0d4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fef0d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7bfae"/>
      <stop offset="1" stop-color="#8a7f69"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8faba4"/>
      <stop offset="1" stop-color="#4f7d73"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#gBg)"/>

  <!-- Distant mountains behind the arch -->
  <path fill="url(#mtn)" opacity="0.9"
    d="M180,260 L240,200 L290,240 L340,180 L400,240 L440,210 L500,260 L500,320 L180,320 Z"/>
  <!-- Warm light through the arch -->
  <rect x="180" y="200" width="320" height="160" fill="url(#gLight)"/>

  <!-- Arch -->
  <g>
    <path fill="url(#stone)" d="M0,380 L0,100 L120,100 C160,100 180,140 180,180 L180,380 Z"/>
    <path fill="url(#stone)" d="M600,380 L600,100 L480,100 C440,100 420,140 420,180 L420,380 Z"/>
    <path fill="url(#stone)" d="M120,100 C160,100 180,140 180,180 L420,180 C420,140 440,100 480,100 L480,60 L120,60 Z"/>
    <!-- stone block lines -->
    <g stroke="#6f6550" stroke-width="1.5" opacity="0.6" fill="none">
      <line x1="0" y1="160" x2="180" y2="160"/>
      <line x1="0" y1="220" x2="180" y2="220"/>
      <line x1="0" y1="280" x2="180" y2="280"/>
      <line x1="420" y1="160" x2="600" y2="160"/>
      <line x1="420" y1="220" x2="600" y2="220"/>
      <line x1="420" y1="280" x2="600" y2="280"/>
    </g>
  </g>

  <!-- Path extending toward horizon -->
  <path d="M300,380 L220,320 L380,320 Z" fill="#d4b680" opacity="0.75"/>
  <path d="M300,380 L250,340 L350,340 Z" fill="#a88b5d" opacity="0.6"/>

  <!-- Foreground grass -->
  <rect x="0" y="360" width="600" height="20" fill="#2b4a42" opacity="0.7"/>
</svg>
